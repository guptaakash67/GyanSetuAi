services:
  - type: keyvalue
    name: gyansetu-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList:
      - source: 0.0.0.0/32
        description: Block external access; the API uses the private network.

  - type: web
    name: gyansetu-api
    runtime: python
    region: singapore
    plan: free
    rootDir: server
    buildCommand: python -m pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: gyansetu-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: gyansetu-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:5173
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX
        value: tatva
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false

databases:
  - name: gyansetu-db
    databaseName: gyansetu
    user: gyansetu
    region: singapore
    plan: free
    postgresMajorVersion: "16"
